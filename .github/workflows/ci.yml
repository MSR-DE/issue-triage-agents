# Runs on every push and pull request: lint + unit tests.
# The tests use a scripted fake Groq API and in-memory data, so CI needs no secrets,
# no database and no tokens.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Lint (ruff)
        run: ruff check ingestion retrieval evals triage tests demo deploy
      - name: Tests (pytest)
        run: pytest -q
